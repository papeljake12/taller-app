{% load piezas %}{% if entrada.url %}<a class="menu__enlace{% if entrada.actual %} es-actual{% endif %}" href="{{ entrada.url }}" data-nombre="{{ entrada.nombre }}"{% if menu_contraido %} title="{{ entrada.nombre }}"{% endif %}{% if entrada.actual %} aria-current="page"{% endif %}{% if entrada.contador %} aria-label="{{ entrada.nombre }} ({{ entrada.contador }})"{% endif %}>{% else %}<a class="menu__enlace" aria-disabled="true" data-nombre="{{ entrada.nombre }}"{% if menu_contraido %} title="{{ entrada.nombre }}"{% endif %}>{% endif %}{% icono entrada.icono %}<span class="menu__texto">{{ entrada.nombre }}</span>{% if entrada.contador %}<span class="menu__contador">{{ entrada.contador }}</span>{% endif %}</a>
