<div class="marco-acceso">
<main class="acceso">
<div class="acceso__marca"><span class="menu__avatar" aria-hidden="true">TE</span><span>Taller de ejemplo</span></div>
<section class="acceso__tarjeta" aria-labelledby="titulo-tallas">
<h1 id="titulo-tallas">Envía tu talla</h1>
<div class="acceso__pedido"><span class="mini"><svg class="icono" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#prenda"></use></svg></span><div><strong>Restaurante El Fogón Costeño</strong><div class="texto-2">18 camisas polo bordadas y 18 delantales</div></div></div>
<form class="columna" action="#" style="gap: 14px">
<div class="campo"><label for="tu-nombre-y-apellido">Tu nombre y apellido</label><input class="campo__control" id="tu-nombre-y-apellido" type="text" value="" placeholder=""></div>
<div class="campo"><label for="talla">Tu talla</label><select class="campo__control" id="talla"><option>Elige tu talla</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>A la medida</option></select><span class="campo__ayuda">Si ninguna te queda, elige «A la medida» y anota tus medidas.</span></div>
<div class="campo"><label for="nota">Observaciones (opcional)</label><textarea class="campo__control" id="nota" placeholder="Por ejemplo: manga larga, un poco más holgado"></textarea></div>
<button type="submit" class="boton boton--principal boton--ancho">Enviar mi talla</button>
</form>
</section>
<p class="acceso__nota">Solo el taller ve tu talla.</p>
</main>
</div>
