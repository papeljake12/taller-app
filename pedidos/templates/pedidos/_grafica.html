{% load piezas %}{% comment %}
Tarjeta "Cobrado y gastado por mes": la gráfica de los últimos seis meses
(calculos.grafica_cobrado_y_gastado, dibujada con la pieza grafica_barras), con su leyenda.
{% endcomment %}<section class="tarjeta" id="hoy-grafica" aria-labelledby="t-grafica">
<div class="tarjeta__cabeza"><h2 id="t-grafica">Cobrado y gastado por mes</h2><div class="leyenda"><span class="leyenda__serie"><span class="leyenda__color leyenda__color--cobrado"></span>Cobrado</span><span class="leyenda__serie"><span class="leyenda__color leyenda__color--gastado"></span>Gastado</span></div></div>
<div class="tarjeta__cuerpo">{% grafica_barras meses %}</div>
</section>
