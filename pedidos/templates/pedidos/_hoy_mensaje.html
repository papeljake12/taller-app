{% comment %}
"Avisar": el mensaje para el cliente (`fila.mensaje`). Con WhatsApp guardado abre el chat con
el mensaje escrito; sin WhatsApp, copia el mensaje para pegarlo donde se quiera.
{% endcomment %}{% if fila.mensaje.enlace %}<a class="boton boton--plano" href="{{ fila.mensaje.enlace }}" target="_blank" rel="noopener">Avisar</a>{% else %}<button type="button" class="boton boton--plano" data-copiar="{{ fila.mensaje.texto }}" title="Copia el mensaje para pegarlo en WhatsApp">Avisar</button>{% endif %}
