[project]
name = "taller-app"
version = "0.1.0"
description = "Pedidos, pagos, tallas, clientes, telas y gastos de un taller de confección"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.pruebas"
python_files = ["test_*.py"]
addopts = "--strict-markers"
