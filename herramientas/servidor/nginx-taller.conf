# Sitio de NGINX para la aplicación del taller.
#
# PLANTILLA: reemplaza TU_DOMINIO por el dominio de la aplicación (por ejemplo,
# taller.midominio.com), en las dos líneas server_name. No hay más valores que cambiar.
#
# Va en /etc/nginx/sites-available/taller (paso 13 de docs/guia-publicacion.md). Después,
# certbot (paso 14) le agrega solo la parte de https y la redirección de http a https.
#
# Qué hace NGINX: recibe a los celulares, entrega directamente las fotos y logos subidos
# (/media/) y le pasa todo lo demás a Gunicorn, que escucha en 127.0.0.1:8000.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # Las fotos de los pedidos y los logos pueden pesar hasta 10 MB (pedidos/fotos.py).
    # Se deja un poco más para el resto del formulario. Sin esto, NGINX rechaza las fotos
    # de más de 1 MB con el error 413.
    client_max_body_size 12m;

    # Comprimir las páginas antes de enviarlas: cargan más rápido con datos móviles.
    # (Los estilos y el JavaScript ya van comprimidos por Whitenoise.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Fotos de pedidos y logos: los entrega NGINX desde la carpeta de archivos subidos
    # (DJANGO_MEDIA_ROOT en el .env). La barra final de las dos líneas es importante.
    location /media/ {
        alias /srv/taller/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    # Todo lo demás (pantallas, formularios, estilos) va a Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        # El nombre con el que entraron (Django lo compara con DJANGO_ALLOWED_HOSTS).
        proxy_set_header Host $host;
        # La dirección real del celular. NGINX la agrega al final de la lista; Django toma
        # la última (config/red.py), así nadie se puede hacer pasar por otro.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # http o https. NGINX siempre lo escribe, así que el celular no lo puede inventar.
        # Con esto Django sabe que la conexión es segura y arma los enlaces con https://.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Cuánto espera NGINX la respuesta de Gunicorn. 120 s por el asistente (tanda 7), igual
        # que el --timeout de herramientas/servidor/taller.service.
        proxy_read_timeout 120s;
    }
}

# Visitas que llegan con otro nombre (por ejemplo, robots que prueban la dirección IP del
# servidor): se cortan sin responder y no llegan a Django.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
